<h1>Pledge tutorial</h1>
<p>Pledge is a small language for learning restricted dependent types. This tutorial is a series of pages, each
with a task to solve in an editor that the type checker checks as you type. It needs JavaScript to run the
checker.</p>
<p>Its sections are Basics, Proofs, Erasure and Beyond Pledge, followed by an appendix of fine points.</p>
<p>Other pages: <a href="index.html">the editor</a>,
<a href="https://github.com/emmarion/pledge/blob/main/DESIGN.md">the specification</a> and
<a href="https://github.com/emmarion/pledge">the repository</a>.</p>
